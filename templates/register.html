{% extends "base.html" %}
{% block title %}Sign Up — VibeSocial{% endblock %}

{% block content %}
<div class="card" style="max-width: 460px; margin: 28px auto;">
  <h2 style="margin-bottom: 6px;">Create Your VibeSocial Account</h2>
  <p class="muted" style="margin-bottom: 18px;">Join creators and share posts, likes, and comments.</p>
  <form method="POST" style="display: flex; flex-direction: column; gap: 14px;">
    {% csrf_token %}
    <div>
      <label class="muted">Full Name</label>
      <input type="text" name="full_name" required />
    </div>
    <div>
      <label class="muted">Username</label>
      <input type="text" name="username" required />
    </div>
    <div>
      <label class="muted">Email</label>
      <input type="email" name="email" required />
    </div>
    <div>
      <label class="muted">Password (min 6 chars)</label>
      <input type="password" name="password" required />
    </div>
    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>
  <p class="muted" style="margin-top: 14px;">
    Already have an account? <a href="{% url 'login' %}" style="color: #f472b6; font-weight: 600;">Login</a>
  </p>
</div>
{% endblock %}
