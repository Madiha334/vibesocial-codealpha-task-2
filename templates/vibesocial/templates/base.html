<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}VibeSocial{% endblock %}</title>
  <style>
    :root {
      --bg-dark: #0d071b;
      --bg-card: rgba(27, 15, 54, 0.78);
      --bg-elevated: rgba(42, 22, 82, 0.85);
      --border: rgba(236, 72, 153, 0.28);
      --purple: #9333ea;
      --purple-bright: #a855f7;
      --pink: #ec4899;
      --pink-neon: #ff2e93;
      --text: #f8f5ff;
      --muted: #c4b5fd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 12% 12%, rgba(147, 51, 234, 0.35), transparent 40%),
        radial-gradient(circle at 88% 18%, rgba(255, 46, 147, 0.28), transparent 42%),
        radial-gradient(circle at 50% 90%, rgba(126, 34, 206, 0.25), transparent 45%),
        var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    a { color: inherit; text-decoration: none; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
      background: rgba(16, 8, 34, 0.85);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      font-size: 1.35rem;
      font-weight: 800;
      background: linear-gradient(90deg, #e879f9, var(--pink-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--pink-neon);
      box-shadow: 0 0 16px rgba(255, 46, 147, 0.35);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--purple), var(--pink-neon));
      border: none;
      color: #fff;
      box-shadow: 0 4px 18px rgba(236, 72, 153, 0.35);
    }

    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 18px 48px;
    }

    .card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
    }

    input, textarea, select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid rgba(168, 85, 247, 0.35);
      background: rgba(13, 7, 27, 0.75);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--pink-neon);
      box-shadow: 0 0 0 3px rgba(255, 46, 147, 0.18);
    }

    .messages {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(147, 51, 234, 0.25);
      font-size: 0.92rem;
    }

    .alert-error {
      background: rgba(225, 29, 72, 0.25);
      border-color: rgba(251, 113, 133, 0.5);
    }

    .muted { color: var(--muted); font-size: 0.88rem; }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-bright), var(--pink-neon));
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(236, 72, 153, 0.2);
      color: #f9a8d4;
      border: 1px solid rgba(236, 72, 153, 0.4);
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="{% url 'feed' %}" class="brand">✨ VibeSocial</a>
    <div class="nav-links">
      <a href="{% url 'feed' %}" class="btn btn-sm">Feed</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' user.username %}" class="btn btn-sm">@{{ user.username }}</a>
        <a href="{% url 'logout' %}" class="btn btn-sm">Logout</a>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-sm">Login</a>
        <a href="{% url 'register' %}" class="btn btn-primary btn-sm">Sign Up</a>
      {% endif %}
    </div>
  </nav>

  <main class="container">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="alert {% if message.tags == 'error' %}alert-error{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script>
    document.querySelectorAll(".toggle-comments-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetId = btn.getAttribute("data-target");
        const box = document.getElementById(targetId);
        if (box) {
          box.style.display = box.style.display === "none" || !box.style.display ? "block" : "none";
        }
      });
    });
  </script>
</body>
</html>
