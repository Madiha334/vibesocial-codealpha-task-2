{% extends "base.html" %}
{% block title %}Login — VibeSocial{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 28px auto;">
  <h2 style="margin-bottom: 6px;">Welcome Back</h2>
  <p class="muted" style="margin-bottom: 18px;">Demo user: <strong>madiha_dev</strong> / password: <strong>password123</strong></p>
  <form method="POST" style="display: flex; flex-direction: column; gap: 14px;">
    {% csrf_token %}
    <div>
      <label class="muted">Username</label>
      <input type="text" name="username" required />
    </div>
    <div>
      <label class="muted">Password</label>
      <input type="password" name="password" required />
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
  </form>
  <p class="muted" style="margin-top: 14px;">
    New here? <a href="{% url 'register' %}" style="color: #f472b6; font-weight: 600;">Create an account</a>
  </p>
</div>
{% endblock %}
